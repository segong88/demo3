<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 목록</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .table th, .table td {
            text-align: center;
            vertical-align: middle;
            padding: 8px;
        }
        .col-bno { width: 10%; }
        .col-title { width: 40%; text-align: left; }
        .col-writer { width: 15%; }
        .col-regidate { width: 12%; }
        .col-modidate { width: 12%; }

        .table td {
            min-height: 50px; /* 적절한 값으로 조정 */
        }

        /* 테이블 고정 레이아웃 */
        table {
            table-layout: fixed;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">목록</h2>
    <div class="d-flex justify-content-end mb-4">
        <a href="/register" class="btn btn-dark">글 등록하기</a>
    </div>
    <table class="table table-hover">
        <thead class="table-dark">
        <tr>
            <th>글번호</th>
            <th>제목</th>
            <th>작성자</th>
            <th>등록일</th>
            <th>수정일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="board : ${boardDTOS}" class="text-center">
            <td><a th:href="@{/board/{bno}(bno = ${board.bno})}" th:text="${board.bno}"></a></td>
            <td class="text-start">
                <a th:href="@{/board/{bno}(bno=${board.bno})}" th:text="${board.title}" class="text-decoration-none"></a>
            </td>
            <td th:text="${board.writer}"></td>
            <td th:text="${board.createDate != null ? #temporals.format(board.createDate, 'yyyy-MM-dd HH:mm') : '-'}"></td>
            <td th:text="${board.modifiedDate != null ? #temporals.format(board.modifiedDate, 'yyyy-MM-dd HH:mm') : '-'}"></td>
        </tr>
        </tbody>
    </table>

    <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${boardDTOS.first} ? 'disabled'">
                <a class="page-link" th:href="@{/boardlist(page=${boardDTOS.number - 1})}">이전</a>
            </li>
            <th:block th:with="start=${(boardDTOS.number / 10) * 10}, end=${T(java.lang.Math).min(start + 9, boardDTOS.totalPages - 1)}">
                <li class="page-item" th:each="i : ${#numbers.sequence(start, end)}"
                    th:classappend="${i == boardDTOS.number} ? 'active'">
                    <a class="page-link" th:href="@{/boardlist(page=${i})}" th:text="${i + 1}"></a>
                </li>
            </th:block>
            <li class="page-item" th:classappend="${boardDTOS.last} ? 'disabled'">
                <a class="page-link" th:href="@{/boardlist(page=${boardDTOS.number + 1})}">다음</a>
            </li>
        </ul>
    </nav>

</div>

</body>
</html>
