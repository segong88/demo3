<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 목록</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .table th, .table td {
            text-align: center;
            vertical-align: middle;
        }
        .col-id { width: 10%; }
        .col-title { width: 50%; text-align: left; }
        .col-author { width: 20%; }
        .col-date { width: 20%; }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">목록</h2>
    <div class="d-flex justify-content-end mb-4">
        <a href="/register" class="btn btn-dark">글 등록하기</a>
    </div>
    <table class="table table-hover">
        <thead class="table-dark">
        <tr>
            <th>글번호</th>
            <th>제목</th>
            <th>작성자</th>
            <th>등록일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="board : ${boardDTOS}" class="text-center">
            <td><a th:href="@{/boarddetail/{bno}(bno = ${board.bno})}" th:text="${board.bno}"></a></td>     <!-- 상세보기 페이지로 못넘어가고 오류가 나네요,, ㅠ -->
            <td class="text-start">
                <a th:href="@{/boarddetail/{bno}(bno=${board.bno})}" th:text="${board.title}" class="text-decoration-none"></a>
            </td>
            <td th:text="${board.writer}"></td>
            <td th:text="${#temporals.format(board.localDateTime, 'yyyy-MM-dd hh:mm')}"></td>
        </tr>
        </tbody>
    </table>
    <!-- 페이지네이션 -->     <!-- 1페이지랑 2페이지랑 레이아웃 왜 달라질까요? 등록일 값이 있고없고 문제인가요? -->
    <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${boardDTOS.first} ? 'disabled'">
                <a class="page-link" th:href="@{/boardlist(page=${boardDTOS.number - 1})}">이전</a>
            </li>
            <!-- 숫자 버튼 (1~10까지만 표시) -->
            <th:block th:with="start=${(boardDTOS.number / 10) * 10}, end=${T(java.lang.Math).min(start + 9, boardDTOS.totalPages - 1)}">
                <li class="page-item" th:each="i : ${#numbers.sequence(start, end)}"
                    th:classappend="${i == boardDTOS.number} ? 'active'">
                    <a class="page-link" th:href="@{/boardlist(page=${i})}" th:text="${i + 1}"></a>
                </li>
            </th:block>
            <li class="page-item" th:classappend="${boardDTOS.last} ? 'disabled'">
                <a class="page-link" th:href="@{/boardlist(page=${boardDTOS.number + 1})}">다음</a>
            </li>
        </ul>
    </nav>

</div>

</body>
</html>
